[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd2d"
version = "0.1.0"
description = "Solveur Navier-Stokes 2D incompressible (grille MAC, frontières immergées) et outils d'analyse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
viz = ["plotly>=5.15", "ffmpeg-python>=0.2"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: validations physiques longues (désélectionner avec -m 'not slow')"]
